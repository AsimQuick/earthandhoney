# ---
# file: ci.yml
# stack: nextjs
# purpose: GitHub Actions CI — lint, typecheck, and test inside Docker; also
#          runs a clean-checkout smoke path that boots web+db via
#          `docker compose up` so latent config gaps (e.g. the sprint-1
#          PAYLOAD_SECRET bug) surface immediately rather than several ACs
#          later
# created-by: dev-team
# related-story: US-7
# related-ac: 7.2
# ---
#
# CI runs ONCE PER STORY, not per acceptance criterion. Every AC is gated
# locally by the orchestrator (lint + typecheck + tests) before anything is
# pushed, so this workflow is the independent clean-environment verification —
# not the dev inner loop.

name: CI

on:
  # Feature branches are covered by the pull_request event (the orchestrator
  # opens one PR per story), so do NOT also trigger on push to feature/** —
  # that would double every run. Pushing a story branch is backup, not CI.
  push:
    branches: [main]
    paths-ignore:
      - 'scrum-master/**'
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR. Never cancel a main run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # docker-compose.ci.yml points `web` at the image pre-built below with a
      # persistent GitHub Actions layer cache. Applied only here, never locally.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app-under-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint
        run: docker compose run --rm --no-deps web npx eslint . --max-warnings 0

      - name: Type check
        run: docker compose run --rm --no-deps web npx tsc --noEmit

      - name: Run tests with coverage
        run: docker compose run --rm web npm test -- --coverage --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80}}'

      - name: Teardown
        if: always()
        run: docker compose down -v

  smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app-under-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot web + db
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke-check a Payload-backed route responds (not a config-gap 500)
        run: |
          http_code="000"
          for i in $(seq 1 30); do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/users || echo "000")
            if [ "$http_code" != "000" ]; then
              echo "web responded with HTTP $http_code"
              break
            fi
            sleep 2
          done
          if [ "$http_code" = "000" ]; then
            echo "web never responded on port 3000 within the smoke window"
            exit 1
          fi
          if [ "$http_code" = "500" ]; then
            echo "web responded 500 — latent config gap (e.g. missing PAYLOAD_SECRET)"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
