# ---
# file: docker-compose.yml
# stack: nextjs
# purpose: Local development services
# created-by: project-lead
# ---

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      # Overrides the generic-scaffold PORT=8000 in .env so the Next.js dev
      # server binds to the port already exposed above (3000:3000).
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COMPOSE_PROJECT_NAME:-app}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Backstage (forked PicPeak, vendor/picpeak — see US-16) ---
  # All three services below carry `profiles: [backstage]` so a bare
  # `docker compose up` (as run by the AC-7.2 CI smoke job, which only
  # exercises the Next.js app) still starts just "web" + "db". Booting
  # Backstage is explicit: `docker compose --profile backstage up -d`.
  # A dedicated Postgres instance, kept separate from the "db" service above
  # (which belongs to the Next.js app's own Payload backend), so the two
  # systems' schemas and lifecycles never collide.
  backstage-db:
    image: postgres:16-alpine
    profiles: ["backstage"]
    environment:
      POSTGRES_DB: ${BACKSTAGE_DB_NAME:-backstage}
      POSTGRES_USER: ${BACKSTAGE_DB_USER:-backstage}
      POSTGRES_PASSWORD: ${BACKSTAGE_DB_PASSWORD:-backstage}
    volumes:
      - backstage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKSTAGE_DB_USER:-backstage} -d ${BACKSTAGE_DB_NAME:-backstage}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backstage-backend:
    profiles: ["backstage"]
    build:
      context: ./vendor/picpeak/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Named BACKSTAGE_NODE_ENV (not the bare NODE_ENV) because .env is
      # shared with the "web" service via its own env_file — a bare
      # NODE_ENV=production placeholder in .env.example would leak into the
      # Next.js app's dev/test container and break Jest/RTL, which rely on
      # NODE_ENV being left for npm/Next.js to set. See AC-16.4.
      NODE_ENV: ${BACKSTAGE_NODE_ENV:-production}
      PORT: "3000"
      JWT_SECRET: ${BACKSTAGE_JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${BACKSTAGE_ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${BACKSTAGE_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${BACKSTAGE_ADMIN_PASSWORD:-change-me-in-production}
      DATABASE_CLIENT: pg
      # Addressed by Docker network hostname, not localhost — this
      # container and backstage-db only ever talk to each other over the
      # compose-managed network.
      DB_HOST: backstage-db
      DB_PORT: "5432"
      DB_USER: ${BACKSTAGE_DB_USER:-backstage}
      DB_PASSWORD: ${BACKSTAGE_DB_PASSWORD:-backstage}
      DB_NAME: ${BACKSTAGE_DB_NAME:-backstage}
      # AC-16.3: point the vendored backend's built-in S3-compatible storage
      # backend (vendor/picpeak/backend/src/services/storage/index.js) at the
      # project's existing Cloudflare R2 bucket — the same R2_* credentials
      # the Next.js app already uses for Payload media (see US-2). No second
      # bucket is provisioned; STORAGE_S3_PREFIX namespaces Backstage's
      # objects inside the one shared bucket so the two apps' uploads don't
      # collide.
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: ${R2_BUCKET}
      STORAGE_S3_REGION: auto
      STORAGE_S3_ENDPOINT: ${R2_ENDPOINT}
      STORAGE_S3_ACCESS_KEY: ${R2_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_KEY: ${R2_SECRET_ACCESS_KEY}
      STORAGE_S3_PREFIX: backstage
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3101:3000"
    # The vendored frontend's nginx.conf proxies every /api route to the
    # Docker hostname "backend" (resolved at request time via Docker's DNS
    # at 127.0.0.11). Our service is called "backstage-backend", so without
    # this alias nginx would fail to resolve it. Fork Discipline says fix it
    # here rather than editing vendor/picpeak/frontend/nginx.conf.
    networks:
      default:
        aliases:
          - backend
    depends_on:
      backstage-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # AC-22.5 / F7: the Gallery-create route (`adminEvents.js:607-611`)
    # unconditionally resolves a local folder at `path.join(__dirname,
    # '../../../storage')`, which from that file's location is `/storage` —
    # not the `/app/storage` the vendored Dockerfile actually creates and
    # chowns to `nodejs` (see PIVOT_AUDIT.md's "unrelated local-storage
    # permission gap" write-up under AC-17.5.1/AC-17.7). With no volume
    # backing `/storage`, a freshly recreated container has no `/storage` at
    # all, and the non-root `nodejs` user the app runs as can't create it
    # under root-owned `/`. This had to be fixed by hand twice
    # (`docker compose exec ... mkdir /storage && chown -R nodejs:nodejs
    # /storage`) before this AC. Rather than patch vendored source (Fork
    # Discipline forbids editing shipped upstream code for a route we haven't
    # otherwise registered as a formal defect — that's F6, out of scope
    # here), this command override runs the same one-time fix automatically,
    # every container start, while the process still runs as root (the image
    # has no USER directive) — the same category of operational step as the
    # vendored `wait-for-db.sh`'s own `chown -R nodejs:nodejs /app/storage`,
    # just covering the second, unmanaged path the create route actually
    # resolves to. It then `exec`s the image's own unmodified
    # `wait-for-db.sh` entrypoint chain, so migrations, the root→nodejs
    # privilege drop, and `node server.js` all still run exactly as upstream
    # ships them.
    command: ["sh", "-c", "mkdir -p /storage && chown -R nodejs:nodejs /storage && exec ./wait-for-db.sh node server.js"]

  backstage-frontend:
    profiles: ["backstage"]
    build:
      context: ./vendor/picpeak/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKSTAGE_API_URL:-/api}
    ports:
      - "3100:80"
    depends_on:
      backstage-backend:
        condition: service_healthy

  # AC-17.6: capture-inbox mail catcher for Backstage's operational gallery
  # emails (gallery_created, gallery_expired, archive_complete, ...). The
  # vendored fork's own compose (vendor/picpeak/docker-compose.yml) already
  # ships this exact service — mirrored here rather than run standalone so it
  # shares this stack's network and the "backstage" profile lifecycle.
  # Hostname "mailhog" is not arbitrary: migrations/core/001_init.js seeds
  # email_configs.smtp_host to `process.env.SMTP_HOST || 'mailhog'`, so a
  # freshly-migrated backstage-db already points at this exact service name.
  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["backstage"]
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # AC-17.7: listener for Backstage's outbound webhooks (event.created,
  # event.published, event.expired, event.archived, photo.uploaded,
  # photo.deleted). The vendored fork ships this exact tiny logger at
  # vendor/picpeak/dev/webhook-receiver — its own webhooks-roundtrip e2e spec
  # (vendor/picpeak/tests/e2e/webhooks-roundtrip.spec.ts) documents it as the
  # dev-loopback target for exactly this proof — mirrored here, unmodified,
  # rather than run standalone, so it shares this stack's network and the
  # "backstage" profile lifecycle. Hostname "webhook-receiver" is not blocked
  # by the pinned fork's own validateExternalUrl SSRF guard
  # (backend/src/utils/networkValidation.js), which only rejects
  # loopback/private-range IPs and *.internal/*.local/*.localhost hostnames —
  # so no WEBHOOK_ALLOW_PRIVATE_URLS override is needed to register a webhook
  # pointed at it.
  webhook-receiver:
    profiles: ["backstage"]
    build:
      context: ./vendor/picpeak/dev/webhook-receiver
      dockerfile: Dockerfile
    ports:
      - "${WEBHOOK_RECEIVER_PORT:-7107}:8888"

  # --- Benchmark harness (US-29 AC-29.1.3) ---
  # Two services behind their own "benchmark" profile (mirrors the
  # "backstage" profile convention above) so a bare `docker compose up`
  # never builds Chrome. `lighthouse-benchmark` measures pages served by a
  # dedicated production build/start container — never the "web" service,
  # which runs `npm run dev`: a dev-mode server is unminified, recompiles
  # routes on demand, and would make the Lighthouse performance score and
  # LCP numbers this harness exists to produce both artificially bad and
  # non-reproducible run to run. "web-benchmark" still reaches
  # "backstage-backend" for the seeded AC-29.1.1 gallery over the shared
  # compose network, using backstageClient.ts's own
  # BACKSTAGE_BACKEND_URL default — so the "backstage" profile must be up
  # (and the gallery seeded, see scripts/ac29.1.1-benchmark-render-proof.sh)
  # before this profile is started. See BACKSTAGE_STARTUP.md's "Benchmark
  # harness" section for the full command.
  web-benchmark:
    profiles: ["benchmark"]
    build: .
    env_file:
      - .env
    environment:
      # Same PORT override as "web" — .env's generic-scaffold PORT=8000
      # would otherwise leak in via env_file.
      PORT: "3000"
      NODE_ENV: production
      # AC-29.2.2.2: which candidate delivery path the two benchmark pages
      # (resolveBenchmarkDeliveryPath.ts) render. env_file above already
      # supplies .env's default; this override lets a caller pass a
      # shell-exported value straight through docker compose without editing
      # .env, e.g. `BENCHMARK_DELIVERY_PATH=presigned-r2 docker compose
      # --profile benchmark up -d --build web-benchmark`.
      BENCHMARK_DELIVERY_PATH: ${BENCHMARK_DELIVERY_PATH:-backstage-proxy}
    # Builds once, then serves that exact build for every harness
    # invocation against this container — "the same build" AC-29.1.3's
    # reproducibility evidence requires two back-to-back runs to share.
    command: ["sh", "-c", "npm run build && npm run start"]
    ports:
      - "3102:3000"
    volumes:
      # AC-29.2.2.2: read-only mount of the presigned URL map
      # scripts/benchmark/presign-r2-urls.sh writes on the host — the same
      # relative path resolveBenchmarkDeliveryPath.ts's PRESIGN_MAP_PATH
      # resolves inside the container (WORKDIR /app). Only consulted when
      # BENCHMARK_DELIVERY_PATH=presigned-r2; a missing/stale file degrades to
      # an empty map (loadPresignedImageMap's own documented behaviour), not a
      # crash.
      - ./scripts/benchmark/presign-data:/app/scripts/benchmark/presign-data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  lighthouse-benchmark:
    profiles: ["benchmark"]
    build:
      context: .
      dockerfile: scripts/benchmark/Dockerfile
    environment:
      # Docker-network hostname, never localhost (CLAUDE.md Docker Rules).
      BENCHMARK_BASE_URL: http://web-benchmark:3000
      # AC-29.2.2.2: must match "web-benchmark"'s own value above — run.ts
      # writes this into the report's `deliveryPath` field and refuses to
      # write at all if the pages it measured don't back it up
      # (observedDeliveryPath.ts's assertObservedDeliveryPath). Not forwarded
      # from "web-benchmark" itself — each service resolves the same env var
      # independently, so a caller must set it identically on both, exactly
      # as documented in resolveBenchmarkDeliveryPath.ts's header.
      BENCHMARK_DELIVERY_PATH: ${BENCHMARK_DELIVERY_PATH:-backstage-proxy}
    volumes:
      # Bind-mounted so each invocation's timestamped JSON report survives
      # the container instead of being lost when it exits.
      - ./scripts/benchmark/results:/app/scripts/benchmark/results
    depends_on:
      web-benchmark:
        condition: service_healthy

volumes:
  pgdata:
  backstage_pgdata:
