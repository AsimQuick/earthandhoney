# ---
# file: docker-compose.yml
# stack: nextjs
# purpose: Local development services
# created-by: project-lead
# ---

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COMPOSE_PROJECT_NAME:-app}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
